<!DOCTYPE html>
<html lang="en">

<head>
  <!-- 1. Metadata -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>404 • Spac2</title>
  <meta name="description" content="Spac2 | 404 Not Found" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#000000" />

  <!-- 2. Favicons & Brand -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- 3. Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Reset & Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #030407;
      --card-bg: rgba(14, 17, 24, 0.65);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.45);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(20px, 4vh, 36px) 20px;
      position: relative;
    }

    /* Ambient Dynamic Starfield & Nebula Glow */
    #starsCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(139, 92, 246, 0.08) 45%, transparent 70%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      animation: pulseNebula 9s ease-in-out infinite alternate;
    }

    @keyframes pulseNebula {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.9; }
    }

    /* Top Brand Capsule */
    .top-header {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .brand-capsule {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px 6px 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      text-decoration: none;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-capsule:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .brand-capsule img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      object-fit: cover;
    }

    .brand-capsule span {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    /* Minimalist 404 Hero Center */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 36px;
      padding: clamp(36px, 7vw, 52px) clamp(24px, 6vw, 36px);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    /* 404 Giant Luminous Digits */
    .error-number {
      font-size: clamp(88px, 20vw, 120px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -4px;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      user-select: none;
      filter: drop-shadow(0 10px 30px rgba(56, 189, 248, 0.2));
    }

    /* Minimal Title */
    .error-title {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.2px;
      margin-bottom: 28px;
    }

    /* Minimal Home CTA */
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 28px;
      background: #ffffff;
      color: #000000;
      border-radius: 9999px;
      font-size: 14.5px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-home svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.4;
      transition: transform 0.2s ease;
    }

    .btn-home:hover {
      background: #f8fafc;
      transform: scale(1.05);
      box-shadow: 0 6px 28px rgba(255, 255, 255, 0.5);
    }

    .btn-home:hover svg {
      transform: scale(1.1);
    }

    .btn-home:active {
      transform: scale(0.95);
    }

    /* Minimal Footer */
    footer {
      position: relative;
      z-index: 10;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    footer a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #ffffff;
    }
  </style>

</head>

<body>
  <!-- Ambient Canvas Starfield -->
  <canvas id="starsCanvas"></canvas>
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Top Minimal Brand -->
  <header class="top-header">
    <a href="/" class="brand-capsule" title="Spac2 Home">
      <img src="/apple-touch-icon.png" alt="Spac2" />
      <span>Spac2</span>
    </a>
  </header>

  <!-- 404 Card -->
  <main>
    <div class="hero-card">
      <div class="error-number">404</div>
      <h1 class="error-title">Page Not Found</h1>

      <a href="/" class="btn-home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </a>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer>
    <a href="https://spac2.com/">spac2.com</a>
  </footer>

  <!-- Starfield Canvas Animation -->
  <script>
    (function () {
      const canvas = document.getElementById('starsCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let stars = [];
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function initStars() {
        stars = [];
        const count = Math.floor((width * height) / 12000);
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.3 + 0.3,
            alpha: Math.random() * 0.75 + 0.25,
            speed: Math.random() * 0.25 + 0.05
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        for (let s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.fill();

          s.y -= s.speed;
          if (s.y < 0) {
            s.y = height;
            s.x = Math.random() * width;
          }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', () => {
        resize();
        initStars();
      });

      resize();
      initStars();
      draw();
    })();
  </script>
</body>

</html>

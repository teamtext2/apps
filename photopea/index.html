<head>

    <meta name="title" content="Spac2 Photopea - photo design online">

    <meta name="apple-mobile-web-app-title" content="Spac2 Photopea">
    <link rel="canonical" href="https://spac2.com/apps/photopea/">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="https://spac2.com/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="https://spac2.com/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://spac2.com/apps/pdf-hub/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://spac2.com/apps/pdf-hub/android-chrome-512x512.png">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="Spac2">

        content="Free photo design online studio powered by Spac2 Photopea. Edit PSD, PNG, JPG, WebP, and SVG files directly in your browser with zero server uploads.">
    <meta property="og:image" content="https://spac2.com/apple-touch-icon.png">
    <meta property="og:image:alt" content="Spac2 Photopea - photo design online">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@spac2com">

    <meta name="twitter:description"
        content="Free photo design online studio powered by Spac2 Photopea. Edit PSD, PNG, JPG, WebP, and SVG files directly in your browser with zero server uploads.">
    <meta name="twitter:image" content="https://spac2.com/apple-touch-icon.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Spac2 Photopea - photo design online",
            "url": "https://spac2.com/apps/photopea/",
            "image": "https://spac2.com/apple-touch-icon.png",
            "description": "Free browser-based photo design online studio powered by Spac2 and Photopea. Edit PSD, PNG, JPG, WebP, and SVG files locally in your browser.",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript and HTML5",
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "publisher": {
                "@type": "Organization",
                "name": "Spac2",
                "url": "https://spac2.com/",
                "logo": {
                    "@type": "ImageObject",
                    "url": "https://spac2.com/apple-touch-icon.png"
                }
            },
            "featureList": [
                "Edit PSD, PNG, JPG, WebP, SVG, and PDF files online",
                "Clipboard paste (Ctrl+V) and drag-and-drop upload",
                "Direct PNG, JPG, and PSD export via Photopea API",
                "100% client-side browser processing"
            ]
        }
    </script>

    <!-- Prevent Theme Flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("spac2_theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (e) {}
        })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JCMEMFLZ14"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-JCMEMFLZ14');
    </script>
    <script defer src="https://team.spac2.com/pageview/tracker.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/style.css?v=2">
</head>

<body>
    <!-- Header Ambient Overlay -->
    <div class="spac2-header-overlay" aria-hidden="true"></div>

    <!-- Floating Rounded Header -->
    <header class="spac2-header-wrapper">
        <div class="spac2-header-capsule">
            <div class="header-left">
                <a href="https://spac2.com/" class="btn-back" title="Back to Spac2 Home" aria-label="Back to Spac2 Home">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </a>

                <a href="/apps/photopea/" class="brand-link" title="Spac2 × Photopea">
                    <div class="brand-logo-card">
                        <img src="https://spac2.com/favicon.ico" alt="Spac2 Logo" class="brand-logo-img">
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">Spac2</span>
                        <span class="brand-divider" aria-hidden="true">&times;</span>
                        <span class="brand-app">Photopea</span>
                    </div>
                </a>
            </div>

            <div class="header-right">
                <button type="button" id="theme-toggle-btn" class="btn-header-icon"
                    aria-label="Toggle Light or Dark Theme" title="Toggle Light / Dark mode">
                    <svg id="theme-icon-sun" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                    </svg>
                    <svg id="theme-icon-moon" class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 1. Landing / Minimal Upload View -->
    <main id="landing-view" class="landing-wrap">
        <section class="hero-section">
            <h1 class="hero-title">Spac2 &times; Photopea</h1>
            <p class="hero-subtitle">
                Upload an image or PSD file to launch the full browser-based studio instantly.
            </p>
        </section>

        <div id="dropzone" class="dropzone-container" role="button" tabindex="0"
            aria-label="Upload image or PSD file by clicking, dragging and dropping, or pasting">
            <input type="file" id="file-input"
                accept="image/*,.psd,.xcf,.sketch,.xd,.pdf,.svg,.raw,.dng,.tiff,.tga" hidden>
            <div class="dropzone-icon-wrap" aria-hidden="true">
                <svg class="svg-icon dropzone-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <polyline points="21 15 16 10 5 21" />
                </svg>
            </div>
            <h2 class="dropzone-title">Drag &amp; drop your image or PSD here</h2>
            <p class="dropzone-subtitle">Processed locally via Photopea Live API &bull; Zero server uploads</p>

            <div class="dropzone-actions">
                <button type="button" class="btn-primary" id="btn-select-file">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <span>Select Image / PSD</span>
                </button>
                <button type="button" class="app-btn-secondary" id="btn-open-blank">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg>
                    <span>Open Blank Editor</span>
                </button>
            </div>

            <div class="dropzone-hints" aria-hidden="true">
                <span class="format-tag">PSD</span>
                <span class="format-tag">PNG</span>
                <span class="format-tag">JPG</span>
                <span class="format-tag">WEBP</span>
                <span class="format-tag">SVG</span>
                <span class="format-tag">PDF</span>
                <span class="format-tag">Paste Ctrl+V</span>
            </div>
        </div>
    </main>

    <!-- 2. Photopea Studio Workspace -->
    <section id="editor-view" class="editor-wrap" aria-label="Photopea Editor Workspace" hidden>
        <div class="editor-toolbar">
            <div class="toolbar-left">
                <button type="button" class="app-btn-secondary" id="btn-back-upload" title="Back to Upload">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        aria-hidden="true">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                    <span>Upload</span>
                </button>
                <span class="file-status-pill" id="editor-file-label">Ready</span>
            </div>

            <div class="toolbar-right">
                <button type="button" class="app-btn-secondary" id="btn-push-file" title="Open another file in Photopea">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    <span>Open File</span>
                </button>
                <button type="button" class="btn-primary export-btn" id="btn-export-png" data-format="png">
                    <span>Export PNG</span>
                </button>
                <button type="button" class="app-btn-secondary export-btn" id="btn-export-jpg" data-format="jpg">
                    <span>JPG</span>
                </button>
                <button type="button" class="app-btn-secondary export-btn" id="btn-export-psd" data-format="psd">
                    <span>PSD</span>
                </button>
            </div>
        </div>

        <div class="iframe-stage">
            <div id="iframe-loader" class="iframe-loader">
                <div class="loader-spinner" aria-hidden="true"></div>
                <p id="loader-status-text">Initializing Spac2 &times; Photopea API...</p>
            </div>
            <iframe id="photopea-frame" title="Spac2 Photopea Studio" allow="clipboard-read; clipboard-write"></iframe>
        </div>
    </section>

    <script src="./js/app.js?v=1"></script>
</body>

</html>
